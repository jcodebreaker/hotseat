<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotseat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,450;6..72,550&display=swap">
<style>
/* Hallmark · component: call window · genre: editorial/technical · theme: custom "broadcast desk"
 * vibe: on-air interview ledger, quiet greys, one tally red
 * paper oklch(98.5% 0.003 250) · accent oklch(58% 0.19 27) tally · Newsreader + IBM Plex Sans + Plex Mono
 * states: idle · connecting · live · thinking · ended · error
 */
:root {
  --color-paper: oklch(98.5% 0.003 250);
  --color-paper-2: oklch(95.5% 0.005 250);
  --color-ink: oklch(22% 0.012 250);
  --color-ink-2: oklch(45% 0.012 250);
  --color-ink-3: oklch(62% 0.01 250);
  --color-rule: oklch(89% 0.006 250);
  --color-tally: oklch(58% 0.19 27);
  --color-tally-soft: oklch(58% 0.19 27 / 0.14);
  --color-wait: oklch(72% 0.14 75);
  --color-wait-ink: oklch(52% 0.12 65);
  --color-done: oklch(52% 0.11 155);
  --color-you: oklch(60% 0.1 250);
  --color-on-tally: oklch(99% 0 0);
  --color-focus: oklch(55% 0.15 250);

  --font-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-md: 0.9375rem;
  --text-q: clamp(1.5rem, 1.1rem + 1.8vw, 2.125rem);

  --space-2xs: 0.25rem;
  --space-xs: 0.5rem;
  --space-sm: 0.75rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2rem;
  --space-2xl: 3rem;

  --radius-sm: 6px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 140ms;
  --dur-med: 260ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-paper: oklch(17% 0.006 250);
    --color-paper-2: oklch(21% 0.008 250);
    --color-ink: oklch(94% 0.004 250);
    --color-ink-2: oklch(74% 0.008 250);
    --color-ink-3: oklch(56% 0.008 250);
    --color-rule: oklch(29% 0.008 250);
    --color-tally: oklch(66% 0.19 27);
    --color-tally-soft: oklch(66% 0.19 27 / 0.18);
    --color-wait: oklch(78% 0.13 75);
    --color-wait-ink: oklch(78% 0.13 75);
    --color-you: oklch(72% 0.1 250);
    --color-done: oklch(72% 0.12 155);
    --color-focus: oklch(72% 0.13 250);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: clip; }
body {
  background: var(--color-paper);
  color: var(--color-ink);
  font: 400 var(--text-md)/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.call {
  max-width: 620px;
  margin: 0 auto;
  padding: var(--space-lg) max(var(--space-md), env(safe-area-inset-right, 0px)) var(--space-2xl) max(var(--space-md), env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
}

/* ── status bar ─────────────────────────────── */
.bar {
  display: flex; align-items: center; gap: var(--space-sm);
  padding-bottom: var(--space-sm);
  border-bottom: 1px solid var(--color-rule);
  min-height: 48px;
}
.tally {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: var(--color-ink-3);
  transition: background var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
}
.call[data-state="live"] .tally { background: var(--color-tally); box-shadow: 0 0 0 4px var(--color-tally-soft); }
.call[data-state="live"].is-thinking .tally { background: var(--color-wait); box-shadow: none; }
.brand { font: 500 var(--text-sm)/1 var(--font-mono); letter-spacing: 0.02em; }
.status {
  flex: 1; min-width: 0;
  font: 400 var(--text-sm)/1.2 var(--font-mono); color: var(--color-ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.call[data-state="live"] .status { color: var(--color-ink); }
.ctl { display: flex; gap: var(--space-xs); flex: none; }
.btn {
  height: 36px; padding: 0 var(--space-sm);
  display: inline-flex; align-items: center; gap: var(--space-xs);
  border-radius: var(--radius-sm);
  font: 500 var(--text-sm)/1 var(--font-body);
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:active { transform: translateY(1px); }
.btn-quiet { box-shadow: inset 0 0 0 1px var(--color-rule); }
.btn-quiet:hover { background: var(--color-paper-2); }
.btn-quiet[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); box-shadow: none; }
.btn-hang { background: var(--color-tally); color: var(--color-on-tally); }
.btn-hang:hover { background: color-mix(in oklch, var(--color-tally) 88%, black); }

/* ── spectrogram: the last few seconds of voice, low to high frequency ── */
.trace { display: flex; flex-direction: column; gap: var(--space-2xs); margin-top: calc(-1 * var(--space-md)); }
.trace canvas { display: block; width: 100%; height: 64px; }
.legend { display: flex; gap: var(--space-md); font: 400 var(--text-xs)/1 var(--font-mono); color: var(--color-ink-3); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: var(--space-xs); vertical-align: -1px; }
.legend .k-claude::before { background: var(--color-ink); }
.legend .k-you::before { background: var(--color-you); }

/* ── the question on air ────────────────────── */
.now { display: flex; flex-direction: column; gap: var(--space-sm); }
.ord { margin: 0; font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-ink-3); font-variant-numeric: tabular-nums; }
.q {
  margin: 0;
  font: 550 var(--text-q)/1.18 var(--font-display);
  font-style: normal;
  letter-spacing: -0.012em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  min-width: 0;
}
.rec { margin: 0; font-size: var(--text-md); color: var(--color-ink-2); max-width: 60ch; }
.rec b { font-weight: 600; color: var(--color-ink); }

/* ── what was just said ─────────────────────── */
.lines { display: flex; flex-direction: column; gap: var(--space-xs); padding-left: var(--space-md); border-left: 2px solid var(--color-rule); }
.lines:empty { display: none; }
.say { margin: 0; font-size: var(--text-md); line-height: 1.45; color: var(--color-ink-2); animation: fade var(--dur-med) var(--ease-out) both; }
.say:last-child { color: var(--color-ink); }
.say b { font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-ink-3); margin-right: var(--space-xs); }
@keyframes fade { from { opacity: 0; } }

/* ── ledger of the round ────────────────────── */
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--color-rule); }
.ledger:empty { display: none; }
.row {
  display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; column-gap: var(--space-sm);
  padding: var(--space-sm) 0;
  border-bottom: 1px solid var(--color-rule);
}
.row .n { font: 400 var(--text-sm)/1.5 var(--font-mono); color: var(--color-ink-3); font-variant-numeric: tabular-nums; }
.row .t { font-size: var(--text-md); line-height: 1.45; min-width: 0; }
.row .a { grid-column: 2 / 4; margin-top: var(--space-2xs); font-size: var(--text-sm); color: var(--color-ink-2); }
.row .a q { font-family: var(--font-display); font-size: var(--text-md); color: var(--color-ink-2); }
.row .s { font: 500 var(--text-xs)/1.5 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-ink-3); white-space: nowrap; }
.row[data-s="pending"] .t { color: var(--color-ink-3); }
.row[data-s="current"] .n, .row[data-s="current"] .s { color: var(--color-tally); }
.row[data-s="current"] .t { font-weight: 500; }
.row[data-s="done"] .s { color: var(--color-done); }
.row[data-s="parked"] .s { color: var(--color-wait-ink); }

/* ── idle / ended ───────────────────────────── */
.pickup { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-md); }
.lead { margin: 0; font: 550 var(--text-q)/1.2 var(--font-display); letter-spacing: -0.012em; text-wrap: balance; overflow-wrap: anywhere; min-width: 0; }
.lead .topic { color: var(--color-ink-2); }
.btn-pick {
  height: 44px; padding: 0 var(--space-lg);
  background: var(--color-ink); color: var(--color-paper);
  border-radius: var(--radius-sm);
  font-size: var(--text-md);
}
.btn-pick:hover { background: color-mix(in oklch, var(--color-ink) 86%, var(--color-paper)); }
.btn-pick:disabled { opacity: 0.55; cursor: default; transform: none; }
.btn-pick .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-tally); }
.hint { margin: 0; font: 400 var(--text-xs)/1.4 var(--font-mono); color: var(--color-ink-3); }
.err { margin: 0; font-size: var(--text-sm); color: var(--color-tally); }
.err:empty { display: none; }

/* Review: every answer, nothing else, before it goes to Claude */
.review { display: flex; flex-direction: column; gap: var(--space-md); }
.review-top { display: flex; align-items: center; gap: var(--space-xs); font: 500 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-ink-3); }
.review-top .left { margin-left: auto; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.review h1 { margin: 0; font: 550 var(--text-q)/1.15 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.review ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-xs); }
.answer { width: 100%; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: var(--space-sm); text-align: left; padding: var(--space-md); border: 1px solid var(--color-rule); border-radius: var(--radius-sm); transition: border-color var(--dur-fast) var(--ease-out); }
.answer:hover { border-color: var(--color-ink-3); }
.answer[data-changed] { border-color: var(--color-you); }
.answer .n { font: 500 var(--text-sm)/1.6 var(--font-mono); color: var(--color-ink-3); }
.answer .body { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.answer .qtext { font-size: var(--text-sm); color: var(--color-ink-2); }
.answer .a { font: 550 1.375rem/1.2 var(--font-display); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs); }
.answer .tag { font: 500 0.6875rem/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; border: 1px solid currentColor; }
.answer .tag.changed { color: var(--color-you); }
.answer .tag.parked { color: var(--color-wait-ink); }
.answer q { font: 450 var(--text-md)/1.4 var(--font-display); color: var(--color-ink-3); }
.review-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
.btn-confirm { display: inline-flex; align-items: center; gap: var(--space-xs); padding: 0.7rem 1.15rem; border-radius: var(--radius-sm); background: var(--color-ink); color: var(--color-paper); font-weight: 600; }
.btn-confirm svg { width: 18px; height: 18px; }
.btn-confirm circle { fill: none; stroke-width: 2.5; }
.btn-confirm .ring-bg { stroke: currentColor; opacity: 0.3; }
.btn-confirm .ring-fg { stroke: currentColor; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.review-foot .hint { margin: 0; font: 400 var(--text-sm)/1.4 var(--font-body); color: var(--color-ink-2); }

@media (max-width: 430px) {
  .call { gap: var(--space-lg); padding-top: var(--space-md); }
  .btn .label { display: none; }
  .ctl .btn { width: 36px; padding: 0; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<main class="call" id="call" data-state="idle" data-mode="listening" aria-label="Hotseat call">
  <header class="bar">
    <span class="tally" aria-hidden="true"></span>
    <span class="brand">hotseat</span>
    <span class="status" id="status" aria-live="polite">Not on a call</span>
    <div class="ctl">
      <button class="btn btn-quiet" id="mute" type="button" aria-pressed="false" aria-label="Mute" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16" hidden/></svg>
        <span class="label" id="mute-label">Mute</span>
      </button>
      <button class="btn btn-hang" id="hang" type="button" aria-label="Hang up" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9.5c-2.9 0-5.6.8-7.9 2.3-.7.4-1 1.2-.9 2l.3 1.7c.1.7.8 1.2 1.5 1.1l2.9-.5c.6-.1 1.1-.6 1.2-1.2l.3-1.9c1.7-.5 3.5-.5 5.2 0l.3 1.9c.1.6.6 1.1 1.2 1.2l2.9.5c.7.1 1.4-.4 1.5-1.1l.3-1.7c.1-.8-.2-1.6-.9-2-2.3-1.5-5-2.3-7.9-2.3z"/></svg>
        <span class="label">Hang up</span>
      </button>
    </div>
  </header>

  <div class="trace" id="meters" aria-hidden="true" hidden>
    <canvas id="trace"></canvas>
    <div class="legend"><span class="k-claude">Claude</span><span class="k-you">You</span></div>
  </div>

  <section class="pickup" id="pickup">
    <p class="lead" id="lead">Waiting for Claude's questions.</p>
    <button class="btn btn-pick" id="start" type="button"><span class="dot" aria-hidden="true"></span><span id="start-label">Pick up</span></button>
    <p class="err" id="err" role="alert"></p>
    <p class="hint">Say "you decide", "park it" or "go back" any time.</p>
  </section>

  <section class="now" id="now" hidden>
    <p class="ord" id="ord"></p>
    <h1 class="q" id="q"></h1>
    <p class="rec" id="rec"></p>
  </section>

  <section class="review" id="review" aria-label="Check your answers" hidden>
    <div class="review-top"><span>Ready to send</span><span class="left" id="review-left"></span></div>
    <h1>Did we get this right?</h1>
    <ol id="review-list"></ol>
    <div class="review-foot">
      <button class="btn-confirm" id="confirm" type="button">
        <svg viewBox="0 0 18 18" aria-hidden="true"><circle class="ring-bg" cx="9" cy="9" r="7"/><circle class="ring-fg" id="ring" cx="9" cy="9" r="7" stroke-dasharray="44" stroke-dashoffset="0"/></svg>
        Confirm
      </button>
      <span class="hint">Or say "send it". Tap an answer to change it.</span>
    </div>
  </section>

  <div class="lines" id="lines" aria-live="polite"></div>

  <ol class="ledger" id="ledger" aria-label="Questions this round"></ol>
</main>

<script type="module">
import { Conversation } from 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.28.0/+esm';

const $ = (id) => document.getElementById(id);
const call = $('call');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

// Call state
let conversation = null;  // only ever the object startSession resolved with
let starting = false;
let muted = false;
let inCall = false;       // startSession resolved and not yet hung up
let live = false;         // POST /api/call {live:true} done: events go straight to the agent
const queue = [];         // SSE events waiting for a live session
let callStartedAt = 0;
let lastCall = null;      // { answered, total, secs } for the ended screen

// Round state (what the agent currently knows)
let round = null;         // { roundId, topic, round, questions[], context }
let status = {};          // questionId -> 'done' | 'parked'
let answers = {};         // questionId -> { answer, quote } | { reason }
let thinking = false, thinkingSince = 0;
let reviewing = false, reviewEndsAt = 0, reviewMs = 1; // every question answered, waiting for Confirm
let changed = new Set();  // questionIds re-answered during the review
let reviewKey = '';       // what the review list last showed
let ending = false, endSawSpeaking = false, endTimer = 0;
const delivered = new Set(); // roundIds already sent to the agent

const post = (path, body) => fetch(path, {
  method: 'POST',
  headers: { 'content-type': 'application/json' },
  body: JSON.stringify(body),
});
const beacon = (path, body) => navigator.sendBeacon(path, new Blob([JSON.stringify(body)], { type: 'application/json' }));
const clock = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

// ---------- UI ----------

function setState(state) {
  call.dataset.state = state;
  const isLive = state === 'live';
  $('pickup').hidden = isLive;
  $('mute').hidden = $('hang').hidden = !isLive;
  $('start').disabled = state === 'connecting';
  $('start-label').textContent = state === 'connecting' ? 'Connecting…' : state === 'ended' ? 'Call back' : 'Pick up';
  if (isLive) startMeter(); else stopMeter();
  render();
}

function setError(text) { $('err').textContent = text || ''; }

// The round the page shows: the live one, else the one waiting in the queue.
const shownRound = () => round ?? queue.find((e) => e.type === 'round')?.data ?? null;

function render() {
  const state = call.dataset.state;
  const r = shownRound();
  call.classList.toggle('is-thinking', thinking);

  // status bar
  let s = 'Not on a call';
  if (state === 'connecting') s = 'Connecting…';
  else if (state === 'live') s = thinking ? `Claude is working · ${clock(Date.now() - thinkingSince)}` : `On air · ${clock(Date.now() - callStartedAt)}`;
  else if (state === 'ended' && lastCall) s = `Call ended · ${clock(lastCall.secs * 1000)}`;
  $('status').textContent = s;

  // idle / ended lead
  if (state !== 'live') {
    const lead = $('lead');
    lead.replaceChildren();
    if (state === 'ended' && lastCall) {
      lead.append(`${lastCall.answered} of ${lastCall.total} answered.`);
    } else if (r) {
      const n = r.questions.length;
      lead.append(`Claude has ${n} question${n === 1 ? '' : 's'} `, el('span', 'topic', `about ${r.topic}.`));
    } else {
      lead.append("Waiting for Claude's questions.");
    }
  }

  // the check before sending: only the answers, nothing else on screen
  const checking = state === 'live' && reviewing && !thinking && !!r;
  $('review').hidden = !checking;
  $('meters').hidden = state !== 'live' || checking;
  $('lines').hidden = $('ledger').hidden = checking;
  if (checking) return renderReview(r);

  // the question on air
  const now = $('now');
  now.hidden = state !== 'live' || !r;
  if (!now.hidden) {
    const qs = r.questions;
    const idx = qs.findIndex((q) => !status[q.id]);
    $('rec').replaceChildren();
    if (thinking || idx === -1) {
      $('ord').textContent = `Round ${r.round}`;
      $('q').textContent = thinking ? 'Claude is working on your answers.' : "That's the round. Passing it to Claude.";
    } else {
      const q = qs[idx];
      $('ord').textContent = `Round ${r.round} · Question ${idx + 1} of ${qs.length}`;
      $('q').textContent = q.question;
      if (q.recommendation) $('rec').append(el('b', null, 'Claude suggests '), q.recommendation);
    }
  }

  renderLedger(r, state);
}

function renderLedger(r, state) {
  const qs = r?.questions ?? [];
  const current = state === 'live' && !thinking ? qs.find((q) => !status[q.id])?.id : null;
  $('ledger').replaceChildren(...qs.map((q, i) => {
    const s = status[q.id] || (q.id === current ? 'current' : 'pending');
    const li = el('li', 'row');
    li.dataset.s = s;
    li.append(
      el('span', 'n', `Q${i + 1}`),
      el('span', 't', q.title || q.question),
      el('span', 's', { done: 'Settled', parked: 'Parked', current: 'Asking', pending: '' }[s]),
    );
    const a = answers[q.id];
    if (s === 'done' && a) {
      const line = el('div', 'a', a.answer + ' ');
      if (a.quote) line.append(el('q', null, a.quote));
      li.append(line);
    } else if (s === 'parked' && a?.reason) {
      li.append(el('div', 'a', a.reason));
    }
    return li;
  }));
}

function renderReview(r) {
  $('now').hidden = true;
  const left = Math.max(0, reviewEndsAt - Date.now());
  $('review-left').textContent = `sends in ${Math.ceil(left / 1000)}s`;
  $('ring').setAttribute('stroke-dashoffset', String(44 * (1 - left / reviewMs)));
  // The clock ticks every second; only rebuild the answers when they change, so taps and focus survive.
  const key = JSON.stringify([r.roundId, status, answers, [...changed]]);
  if (key === reviewKey) return;
  reviewKey = key;
  $('review-list').replaceChildren(...r.questions.map((q, i) => {
    const a = answers[q.id] ?? {};
    const parked = status[q.id] === 'parked';
    const b = el('button', 'answer');
    b.type = 'button';
    b.setAttribute('aria-label', `Change answer ${i + 1}`);
    if (changed.has(q.id)) b.dataset.changed = '';
    const ans = el('span', 'a', parked ? 'Later' : a.answer || '');
    if (changed.has(q.id)) ans.append(el('span', 'tag changed', 'Changed'));
    else if (parked) ans.append(el('span', 'tag parked', 'Parked'));
    const body = el('span', 'body');
    body.append(el('span', 'qtext', q.question), ans);
    const said = parked ? a.reason : a.quote;
    if (said) body.append(el('q', null, said));
    b.append(el('span', 'n', String(i + 1)), body);
    b.addEventListener('click', () => changeAnswer(q.id));
    const li = el('li');
    li.append(b);
    return li;
  }));
}

function caption(source, text) {
  text = String(text ?? '').trim();
  if (!text || text.startsWith('[CLAUDE]')) return;
  const p = el('p', 'say');
  p.append(el('b', null, source === 'user' ? 'You' : 'Hotseat'), text);
  const box = $('lines');
  box.append(p);
  while (box.children.length > 2) box.firstElementChild.remove();
}

// Tick the clocks in the status bar once a second while on a call.
setInterval(() => { if (call.dataset.state === 'live') render(); }, 1000);

// ---------- spectrogram ----------
// Each column is one sample of the call's real frequency data (agent voice and your mic), folded
// into 16 log-spaced bands from low to high. Columns scroll right to left; silence is blank.
// Shaded in the speaker's colour, so the back-and-forth of the last few seconds is visible.

const trace = $('trace');
const tctx = trace.getContext('2d');
const BANDS = 16, HEIGHT = 64, COL_W = 3, SAMPLE_MS = 50;
let raf = 0, lastSample = 0, cols = [], colors = {};

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const v = (n) => cs.getPropertyValue(n).trim();
  colors = { claude: v('--color-ink'), you: v('--color-you') };
}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); drawTrace(); });

function sizeTrace() {
  const dpr = window.devicePixelRatio || 1;
  const { width } = trace.getBoundingClientRect();
  trace.width = Math.round(width * dpr);
  trace.height = Math.round(HEIGHT * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.ceil(width / COL_W) + 1;
  cols = cols.slice(-n);
  while (cols.length < n) cols.unshift(null);
}

// FFT bins (0-255 each) → BANDS energies (0-1). Voice lives in the low half of the bins,
// so bands are log-spaced over the first 40% of them.
function fold(bins) {
  if (!bins?.length) return null;
  const top = Math.max(BANDS + 1, Math.floor(bins.length * 0.4));
  return Array.from({ length: BANDS }, (_, b) => {
    const lo = Math.floor(Math.pow(top, b / BANDS)), hi = Math.max(lo + 1, Math.floor(Math.pow(top, (b + 1) / BANDS)));
    let sum = 0;
    for (let i = lo; i < hi; i++) sum += bins[i] ?? 0;
    return Math.min(1, Math.max(0, (sum / (hi - lo) / 255 - 0.12) * 1.5));
  });
}

// Without frequency data (older SDK), shape a voice-like profile from the volume alone.
function fromVolume(v, high) {
  if (v < 0.04) return new Array(BANDS).fill(0);
  const f1 = high ? 4 : 3, f2 = high ? 9 : 8;
  const g = (b, c, s) => Math.exp(-((b - c) ** 2) / (2 * s * s));
  return Array.from({ length: BANDS }, (_, b) => Math.min(1, v * (g(b, 1, 1.2) + 0.8 * g(b, f1, 1.6) + 0.5 * g(b, f2, 2))));
}

const energy = (bands) => bands.reduce((a, e) => a + e, 0);

function sample() {
  let out = fold(conversation?.getOutputByteFrequencyData?.());
  let inp = muted ? null : fold(conversation?.getInputByteFrequencyData?.());
  out ??= fromVolume(Math.sqrt(conversation?.getOutputVolume?.() ?? 0), false);
  inp ??= fromVolume(muted ? 0 : Math.sqrt(conversation?.getInputVolume?.() ?? 0), true);
  const eo = energy(out), ei = energy(inp);
  cols.push(Math.max(eo, ei) < 0.4 ? null : eo >= ei ? { who: 'claude', bands: out } : { who: 'you', bands: inp });
  cols.shift();
}

function drawTrace() {
  const w = trace.clientWidth;
  if (!w) return;
  tctx.clearRect(0, 0, w, HEIGHT);
  const bh = HEIGHT / BANDS;
  const x0 = w - cols.length * COL_W;
  cols.forEach((c, i) => {
    if (!c) return;
    tctx.fillStyle = colors[c.who];
    c.bands.forEach((e, b) => {
      if (e < 0.05) return;
      tctx.globalAlpha = e;
      tctx.fillRect(x0 + i * COL_W, HEIGHT - (b + 1) * bh, COL_W - 0.5, bh - 0.5);
    });
  });
  tctx.globalAlpha = 1;
}

function meter(t) {
  if (t - lastSample >= SAMPLE_MS) {
    lastSample = t;
    sample();
    drawTrace();
  }
  raf = requestAnimationFrame(meter);
}
function startMeter() {
  cancelAnimationFrame(raf);
  requestAnimationFrame(() => { sizeTrace(); drawTrace(); raf = requestAnimationFrame(meter); });
}
function stopMeter() { cancelAnimationFrame(raf); }
addEventListener('resize', () => { if (call.dataset.state === 'live') { sizeTrace(); drawTrace(); } });

// ---------- events from Claude Code ----------

function frame(ev) {
  if (ev.type === 'thinking') return '[CLAUDE] thinking';
  if (ev.type === 'end') return '[CLAUDE] end';
  const r = ev.data;
  const lines = r.questions.map((q) => `- ${q.id} | ${q.title} | ${q.question} | recommended: ${q.recommendation}`);
  return `[CLAUDE] round ${r.round} on "${r.topic}". Questions:\n${lines.join('\n')}\nContext: ${r.context ?? ''}`;
}

function deliver(ev) {
  if (ev.type === 'round') {
    if (delivered.has(ev.data.roundId)) return; // SSE replay of a round the agent already has
    delivered.add(ev.data.roundId);
    round = ev.data;
    status = {};
    answers = {};
    thinking = false;
    reviewing = false;
    changed = new Set();
  } else if (ev.type === 'thinking') {
    if (thinking) return;
    thinking = true;
    reviewing = false;
    thinkingSince = Date.now();
  } else if (ev.type === 'end') {
    if (ending) return;
    ending = true;
    endSawSpeaking = false;
    clearTimeout(endTimer);
    endTimer = setTimeout(() => conversation?.endSession(), 10_000);
  }
  render();
  conversation.sendUserMessage(frame(ev));
}

function onEvent(ev) {
  if (conversation && live) return deliver(ev);
  if (ev.type === 'end') {
    // Nobody is on the call: there is nothing to say goodbye to.
    queue.length = 0;
    return render();
  }
  if (ev.type === 'round' && (delivered.has(ev.data.roundId) || queue.some((q) => q.type === 'round' && q.data.roundId === ev.data.roundId))) return;
  if (ev.type === 'thinking' && queue.at(-1)?.type === 'thinking') return;
  queue.push(ev);
  render();
}

function flush() {
  while (queue.length && conversation && live) deliver(queue.shift());
}

const events = new EventSource('/api/events');
for (const type of ['round', 'thinking', 'end']) {
  events.addEventListener(type, (e) => {
    let data = {};
    try { data = JSON.parse(e.data || '{}'); } catch {}
    onEvent({ type, data });
  });
}
// The review is screen-only: the agent already knows every answer is in and does its own recap.
events.addEventListener('review', (e) => {
  let data = {};
  try { data = JSON.parse(e.data || '{}'); } catch {}
  if (round?.roundId !== data.roundId) return;
  reviewing = true;
  reviewMs = Math.max(1, data.sendsInMs);
  reviewEndsAt = Date.now() + data.sendsInMs;
  render();
});

// ---------- client tools ----------

async function record(path, body, questionId, mark, ok) {
  const roundId = round?.roundId;
  if (roundId == null) return 'No open round.';
  try {
    const r = await post(path, { roundId, questionId, ...body });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      return j.error || `Not saved (${r.status}).`;
    }
    if (round?.roundId === roundId) {
      if (reviewing) changed.add(questionId);
      status[questionId] = mark;
      answers[questionId] = body;
      render();
    }
    return ok;
  } catch (e) {
    return `Not saved: ${e.message}`;
  }
}

const clientTools = {
  settle_answer: ({ question_id, answer, quote }) =>
    record('/api/settle', { answer, quote }, question_id, 'done', 'Saved.'),
  park_question: ({ question_id, reason }) =>
    record('/api/park', { reason }, question_id, 'parked', 'Parked.'),
  confirm_round: () => confirmRound(),
};

async function confirmRound() {
  const roundId = round?.roundId;
  if (roundId == null) return 'No open round.';
  try {
    const r = await post('/api/confirm', { roundId });
    if (r.ok) return 'Sent to Claude.';
    const j = await r.json().catch(() => ({}));
    return j.error || `Not sent (${r.status}).`;
  } catch (e) {
    return `Not sent: ${e.message}`;
  }
}

// Tapping an answer: hold the automatic send and have the agent ask that question again.
function changeAnswer(questionId) {
  if (!reviewing || round == null) return;
  post('/api/hold', { roundId: round.roundId }).catch(() => {});
  conversation?.sendUserMessage(`[CLAUDE] change ${questionId}`);
}

$('confirm').addEventListener('click', () => { confirmRound(); });

// ---------- session ----------

function hangup() {
  if (!inCall) return;
  inCall = false;
  live = false;
  post('/api/hangup', {}).catch(() => {});
  post('/api/call', { live: false }).catch(() => {});
}

function onDisconnect() {
  const wasInCall = inCall;
  if (wasInCall) {
    const qs = round?.questions ?? [];
    lastCall = { answered: qs.filter((q) => status[q.id] === 'done').length, total: qs.length, secs: Math.round((Date.now() - callStartedAt) / 1000) };
  }
  hangup();
  clearTimeout(endTimer);
  conversation = null;
  ending = false;
  thinking = false;
  reviewing = false;
  muted = false;
  setMuteUi();
  if (wasInCall) setState('ended'); else render();
}

async function start() {
  if (starting || conversation) return;
  starting = true;
  setError('');
  $('lines').replaceChildren();
  round = null; status = {}; answers = {}; thinking = false; reviewing = false; changed = new Set(); reviewKey = '';
  setState('connecting');
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const t = await fetch('/api/token').then((r) => r.json());
    if (!t.token) throw new Error(t.error || 'No conversation token.');
    const c = await Conversation.startSession({
      conversationToken: t.token,
      connectionType: 'webrtc',
      clientTools,
      onDisconnect,
      onModeChange: ({ mode }) => {
        call.dataset.mode = mode;
        if (!ending) return;
        if (mode === 'speaking') endSawSpeaking = true;
        else if (mode === 'listening' && endSawSpeaking) conversation?.endSession();
      },
      onMessage: ({ source, message }) => {
        caption(source, message);
        // Talking during the check pushes the automatic send back.
        if (source === 'user' && reviewing && round) post('/api/hold', { roundId: round.roundId }).catch(() => {});
      },
      onError: (e) => console.error('[hotseat]', e),
    });
    // onConnect fires before startSession resolves; from here on only the resolved object is used.
    conversation = c;
    inCall = true;
    callStartedAt = Date.now();
    setState('live');
    await post('/api/call', { live: true }).catch(() => {});
    if (!inCall) return; // hung up while the POST was in flight
    live = true;
    flush();
  } catch (e) {
    setState(lastCall ? 'ended' : 'idle');
    setError(e?.name === 'NotAllowedError' ? 'Allow the microphone to pick up.' : String(e?.message || e));
  } finally {
    starting = false;
  }
}

function setMuteUi() {
  const b = $('mute');
  b.setAttribute('aria-pressed', String(muted));
  b.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
  $('mute-label').textContent = muted ? 'Unmute' : 'Mute';
  b.querySelector('.slash').toggleAttribute('hidden', !muted);
}

$('start').addEventListener('click', start);
$('hang').addEventListener('click', () => conversation?.endSession());
$('mute').addEventListener('click', () => {
  muted = !muted;
  conversation?.setMicMuted(muted);
  setMuteUi();
});

addEventListener('beforeunload', () => {
  if (!inCall) return; // no call: the server notices the closed SSE stream on its own
  inCall = false;
  beacon('/api/hangup', {});
  beacon('/api/call', { live: false });
});

render();
</script>
</body>
</html>
